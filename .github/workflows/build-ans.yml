name: BUILDSIREFT

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build_release_android:
    name: Build project in release (Android ARM64)
    runs-on: ubuntu-latest
    env:
      # NDK r27 is the latest LTS as of 2025 and ships clang 18.
      NDK_VERSION: "27.2.12479018"
      # Minimum API level 29 (Android 10)
      ANDROID_API: "29"
      # Rust target triple for 64-bit Android on ARM hardware.
      CARGO_TARGET: "aarch64-linux-android"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust stable + Android target
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ env.CARGO_TARGET }}

      # ── Android NDK ───────────────────────────────────────────────────────
      # sdkmanager is pre-installed on ubuntu-latest GitHub runners.
      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.NDK_VERSION }}"

      # ── Cargo / NDK linker wiring ─────────────────────────────────────────
      - name: Configure Cargo to use NDK linker
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          LINKER="$TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang"
          AR="$TOOLCHAIN/llvm-ar"

          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF

          # --- Android ARM64 cross-compilation (injected by CI) ---
          [target.aarch64-linux-android]
          linker = "$LINKER"
          ar     = "$AR"
          EOF

          echo "Configured linker: $LINKER"
          echo "Configured ar:     $AR"

      # ── Build release binary ───────────────────────────────────────────────
      - name: Build release binary
        env:
          RUSTFLAGS: "-Dwarnings -C link-arg=-Wl,--build-id=sha1"
          CC_aarch64_linux_android: "${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API }}-clang"
          CXX_aarch64_linux_android: "${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API }}-clang++"
          AR_aarch64_linux_android: "${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
        run: |
          cargo build --release --target ${{ env.CARGO_TARGET }} --verbose

      # ── Stage & Upload artifact ───────────────────────────────────────────
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ env.CARGO_TARGET }}/release/pumpkin" \
             "dist/pumpkin-ARM64-Android"
          echo "SHA256: $(sha256sum dist/pumpkin-ARM64-Android)"

      - name: Export executable
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-ARM64-Android
          compression-level: 9
          path: dist/pumpkin-ARM64-Android
          

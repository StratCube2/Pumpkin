name: Cargo Build, Test, and Linting

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
  machete:
    name: Detect unused dependencies
    runs-on: ubuntu-latest
    needs: [format]
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: bnjbvr/cargo-machete@main
  clippy_debug:
    name: Run lints (debug)
    runs-on: ubuntu-latest
    needs: [machete]
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (debug)
        run: cargo clippy --all-targets --all-features
  clippy_release:
    name: Run lints (release)
    runs-on: ubuntu-latest
    needs: [machete]
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (release)
        run: cargo clippy --release --all-targets --all-features
  build_and_test:
    name: Build project and test
    runs-on: ${{ matrix.os }}
    needs: [clippy_debug, clippy_release]
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-26.04-arm,
            windows-latest,
            windows-11-arm,
            macos-latest,
          ]
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Cargo nextest
        run: cargo nextest run --verbose
      - name: Cargo doctest
        run: cargo test --doc --verbose
  build_release:
    name: Build project in release
    runs-on: ${{ matrix.os }}
    needs: [build_and_test]
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
            macos-latest,
          ]
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      
      - name: Build Release
        shell: bash
        run: |
          cargo build --verbose --release
          
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          cp "target/release/pumpkin$EXT" "dist/pumpkin-${{ runner.arch }}-${{ runner.os }}$EXT"

      - name: Upload unsigned executable for SignPath (Windows only)
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ runner.arch }}-${{ runner.os }}
          path: dist/pumpkin-*
          retention-days: 1

      - name: Submit SignPath signing request (Windows only)
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload_unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: dist/signed/

      - name: Overwrite with signed version (Windows only)
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          cp dist/signed/* dist/
          rm -rf dist/signed/

      - name: Export executable
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-${{ runner.arch }}-${{ runner.os }}
          compression-level: 9
          path: dist/pumpkin-*
  build_release_android:
    name: Build project in release (Android ARM64)
    runs-on: ubuntu-latest
    needs: [build_and_test]
    env:
      # NDK r27 is the latest LTS as of 2025 and ships clang 18.
      # Pinning by version keeps builds reproducible; bump deliberately.
      NDK_VERSION: "27.2.12479018"
      # Minimum API level 29 (Android 10) — first version that ships the 64-byte
      # TLS alignment Bionic requires, and the W^X SELinux policy Kurbyx works
      # around via the system linker.  Do not lower this.
      ANDROID_API: "29"
      # Rust target triple for 64-bit Android on ARM hardware.
      CARGO_TARGET: "aarch64-linux-android"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust stable + Android target
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ env.CARGO_TARGET }}

      # ── Android NDK ───────────────────────────────────────────────────────
      # sdkmanager is pre-installed on ubuntu-latest GitHub runners.
      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.NDK_VERSION }}"

      # ── Cargo / NDK linker wiring ─────────────────────────────────────────
      # Cargo needs to know which linker and ar tool to use when targeting
      # Android.  The NDK ships clang wrappers that handle sysroot selection
      # automatically once we tell them the minimum API level.
      - name: Configure Cargo to use NDK linker
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Linker wrapper: aarch64-linux-android<API>-clang
          LINKER="$TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang"
          # AR tool: llvm-ar (NDK r23+ ships a universal llvm-ar)
          AR="$TOOLCHAIN/llvm-ar"

          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

          # Write .cargo/config.toml so every crate in the workspace picks
          # up the linker without needing environment-variable magic.
          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF

          # --- Android ARM64 cross-compilation (injected by CI) ---
          [target.aarch64-linux-android]
          linker = "$LINKER"
          ar     = "$AR"
          EOF

          echo "Configured linker: $LINKER"
          echo "Configured ar:     $AR"

      # ── Build release binary ───────────────────────────────────────────────
      # RUSTFLAGS carries the -Dwarnings from the root env, plus we add the
      # Android-specific flags:
      #   -C link-arg=--build-id=sha1   reproducible build IDs
      # We intentionally do NOT set -C target-cpu=native here because the
      # build host is x86_64 and "native" would produce an x86 CPU profile
      # for an ARM binary, which is wrong.  Cortex-A55/A78 are reasonable
      # defaults for the Snapdragon 870 (which pairs A55+A77 clusters).
      - name: Build release binary
        env:
          RUSTFLAGS: "-Dwarnings -C link-arg=-Wl,--build-id=sha1"
          # Point cc-rs (used by wasmtime's C++ build) at the NDK clang.
          # wasmtime vendors its own copy of the C++ stdlib so we don't need
          # to provide a sysroot separately.
          CC_aarch64_linux_android: "${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API }}-clang"
          CXX_aarch64_linux_android: "${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API }}-clang++"
          AR_aarch64_linux_android: "${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
        run: |
          cargo build --release --target ${{ env.CARGO_TARGET }} --verbose

      # ── Rename + stage artifact ───────────────────────────────────────────
      # Follow the naming convention the existing CI uses for other platforms:
      #   pumpkin-<ARCH>-<OS>
      # "Android" makes the target unambiguous vs the Linux glibc build.
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ env.CARGO_TARGET }}/release/pumpkin" \
             "dist/pumpkin-ARM64-Android"
          echo "SHA256: $(sha256sum dist/pumpkin-ARM64-Android)"

      - name: Export executable
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-ARM64-Android
          compression-level: 9
          path: dist/pumpkin-ARM64-Android
  draft_release:
    permissions:
      contents: write
    needs: [build_release, build_release_android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download prebuilt binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "**/pumpkin-*"
          path: dist/
          merge-multiple: true
      - name: Generate release notes
        run: |
          tree dist/
          echo "From commit: $(git rev-parse --short HEAD)" > dist/RELEASE.md
          echo "Generated on: $(date -u +"%Y-%m-%d %H:%M") UTC" >> dist/RELEASE.md
          cat dist/RELEASE.md

      - name: Update the nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force nightly && git push --force origin tag nightly

      - name: Draft a nightly github release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: dist/pumpkin*
          tag_name: nightly
          name: Nightly Build
          body_path: dist/RELEASE.md
